<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#F5EEDF">
  <title>Wok &amp; Flame</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Familjen+Grotesk:wght@400;500;600&family=Gochi+Hand&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="splash.css">
  <!-- warm the menu while the intro plays, so "Open the menu" lands instantly -->
  <link rel="prefetch" href="../menu/">
  <link rel="prefetch" href="../menu/menu.css">
  <link rel="prefetch" href="../menu/menu.js">
  <link rel="prefetch" href="../data/menu.json" as="fetch" crossorigin="anonymous">
</head>
<body>
  <main class="stage" id="stage">

    <!-- Hand-drawn "line boil" for the line illustrations: seed is stepped from JS -->
    <svg class="defs" width="0" height="0" aria-hidden="true">
      <filter id="boil" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence id="boilNoise" type="fractalNoise" baseFrequency="0.035" numOctaves="2" seed="1" />
        <feDisplacementMap in="SourceGraphic" scale="2.4" />
      </filter>
    </svg>

    <!-- ───────── Scene 1: loader / chef pouring oil ───────── -->
    <section class="scene scene--loader" id="loader" aria-label="Loading">
      <p class="brand-mark">wok &amp; flame</p>

      <!--
        The engraving is one traced image, so moving parts are cut out with clip-paths:
        base (everything minus tin + pan), tin layer, pan layer. All three <use> the same art.
      -->
      <svg class="chef" viewBox="170 40 610 445" aria-hidden="true">
        <defs>
          <path id="tinShape" d="M260,298 L290,232 L345,230 L380,238 L404,270 L406,302 L380,352 L350,354 L310,332 L266,318 Z" />
          <path id="panShape" d="M238,400 L455,398 L596,381 L602,403 L472,426 L466,437 L238,437 Z M240,449 L468,449 L464,480 L244,480 Z" />
          <clipPath id="clipTin"><use href="#tinShape" /></clipPath>
          <clipPath id="clipPan"><use href="#panShape" /></clipPath>
          <mask id="maskBase" maskUnits="userSpaceOnUse" x="0" y="0" width="790" height="502">
            <rect width="790" height="502" fill="#fff" />
            <use href="#tinShape" fill="#000" />
            <use href="#panShape" fill="#000" />
          </mask>
          <!-- ink-spread reveal: a wobbly blob (built in JS) scales up from the chef's face -->
          <mask id="maskReveal" maskUnits="userSpaceOnUse" x="0" y="0" width="790" height="502">
            <path id="revealBlob" fill="#fff" />
          </mask>
        </defs>

        <g class="art" id="art" mask="url(#maskReveal)">
          <g mask="url(#maskBase)"><use href="#chef-engraving" /></g>
          <g id="pan"><g clip-path="url(#clipPan)"><use href="#chef-engraving" /></g></g>
          <g id="tin"><g clip-path="url(#clipTin)"><use href="#chef-engraving" /></g></g>
        </g>

        <!-- oil glints running down the stream -->
        <path id="flow" d="M361,348 L361,430" />
        <g id="ripples" class="ink">
          <ellipse cx="360" cy="431" rx="8" ry="2" />
          <ellipse cx="360" cy="431" rx="8" ry="2" />
          <ellipse cx="360" cy="431" rx="8" ry="2" />
        </g>
        <g id="sizzle">
          <circle cx="300" cy="424" r="3" /><circle cx="326" cy="418" r="2.5" />
          <circle cx="392" cy="420" r="3" /><circle cx="414" cy="426" r="2.5" />
          <circle cx="344" cy="428" r="2.2" /><circle cx="282" cy="430" r="2.5" />
          <circle cx="430" cy="418" r="2.2" />
        </g>
        <!-- each wisp is a cream halo + ink line so it reads over the hatching -->
        <g id="steam" class="ink">
          <path d="M296,402 C286,384 304,372 294,354 C286,338 300,326 294,310" />
          <path d="M398,398 C392,384 406,374 398,360 C392,348 402,338 398,326" />
          <path d="M428,404 C420,386 438,374 428,356 C420,340 436,328 428,310" />
          <path d="M456,408 C450,394 464,384 456,370 C450,358 460,348 456,336" />
        </g>
      </svg>

      <div class="loader__meta">
        <p class="percent"><span id="pct">0</span>%</p>
        <p class="caption">Warming up the kitchen</p>
      </div>
    </section>

    <!-- ───────── Scene 2: welcome / tea splash / CTA ───────── -->
    <section class="scene scene--welcome" id="welcome" aria-label="Welcome">
      <h1 class="headline">
        <span class="hl slide">Welcome to</span>
        <span class="hl hl--indent slide">the kitchen of</span>
        <span class="hl hl--script slide"><span class="write">Wok &amp; Flame!</span></span>
      </h1>
      <p class="tagline slide">A multi-cuisine kitchen</p>

      <!-- PLACEHOLDER: confirm hours + cuisines with the restaurant -->
      <div class="info">
        <p class="hours slide">12 pm – 11 pm</p>
        <ul class="cuisines">
          <li class="slide">Indian</li>
          <li class="slide">Chinese</li>
          <li class="slide">Thai</li>
          <li class="slide">Continental</li>
        </ul>
      </div>
